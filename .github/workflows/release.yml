name: Release

# Triggers:
#   - release:published — fires after a GitHub Release is published from a tag.
#   - workflow_dispatch — manual UI/CLI trigger. Default `dry-run: true`
#     runs `npm publish --dry-run` + `npm pack --dry-run` only.
#
# Publish path is direct `npm publish --access public --provenance --loglevel
# verbose` — NOT `pnpm changeset publish` (npm support confirmed wrappers
# can bypass OIDC token-exchange; that was the v1.1.0–v1.2.0 E404 root cause).
# Trusted Publishing requires npm CLI ≥ 11 (see "Pin npm to v11" step).

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run npm publish --dry-run + npm pack --dry-run only (no publish, no commit, no GitHub Release)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write       # needed for sed-and-commit + GitHub Release create
  id-token: write       # needed for npm Trusted Publishing (OIDC) + provenance
  # NOTE: pull-requests:write was needed for changesets/action; now removed
  # since we publish via direct `npm publish` (no Release PR flow).

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release (npm Trusted Publishing + GH Release)
    runs-on: ubuntu-latest
    # Skip on forks; only the canonical owner publishes.
    if: github.repository_owner != ''
    env:
      # Belt-and-suspenders: provenance attestation auto-generated under OIDC,
      # explicit flag still recognized by npm CLI <11.5.1 fallback paths.
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
          # Use a token that can push back to main (sed install.sh after
          # publish). Default GITHUB_TOKEN works because permissions.contents
          # is `write` above.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22.x
          cache: pnpm
          # NOTE: registry-url INTENTIONALLY OMITTED. setup-node@v4 with
          # registry-url auto-writes a project .npmrc containing
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` AND sets
          # NODE_AUTH_TOKEN as an empty job-level env var. Both force the
          # token-auth path and silently bypass OIDC token-exchange (npm
          # support E404 root cause). Without registry-url, npm CLI uses
          # its built-in registry default (https://registry.npmjs.org/)
          # and OIDC takes over cleanly when id-token: write is granted.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Detect publish gate
        id: gate
        run: |
          PRIVATE=$(node -p "require('./package.json').private === true")
          echo "private=$PRIVATE" >> "$GITHUB_OUTPUT"
          if [ "$PRIVATE" = "true" ]; then
            echo "package.json private:true — publish step will be skipped."
          else
            echo "package.json private:false — publish step will run."
          fi

      # ---------------------------------------------------------------------
      # DRY RUN PATH — workflow_dispatch with dry-run=true (default).
      # Runs the publish pipeline in dry-run mode only; never publishes,
      # never commits, never creates a GitHub Release.
      # ---------------------------------------------------------------------
      - name: Dry-run — npm publish --dry-run
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry-run == 'true'
        run: |
          echo "::group::npm publish --dry-run"
          npm publish --dry-run --access public || true
          echo "::endgroup::"

      - name: Dry-run — npm pack --dry-run
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry-run == 'true'
        run: |
          echo "::group::npm pack --dry-run"
          npm pack --dry-run --json
          echo "::endgroup::"

      - name: Dry-run — exit early
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry-run == 'true'
        run: |
          echo "Dry-run complete. No publish, no commit, no GitHub Release created."
          exit 0

      # ---------------------------------------------------------------------
      # REAL PUBLISH PATH — release:published event OR workflow_dispatch with
      # dry-run=false. Direct `npm publish` (NOT `pnpm changeset publish`)
      # because pnpm/changesets wrappers can bypass npm's OIDC token-exchange
      # flow per npm support (E404 root cause for v1.1.0–v1.2.0). Trusted
      # Publishing requires:
      #   1. id-token: write permission (set above)
      #   2. npm CLI ≥ 11 (Node 22 ships ~npm 10.x — must upgrade)
      #   3. NO NPM_TOKEN, NO //registry.npmjs.org/:_authToken in env or
      #      .npmrc (presence forces token-auth path; OIDC is bypassed)
      #   4. Direct `npm publish` invocation (not via lerna/pnpm -r/changesets)
      # ---------------------------------------------------------------------

      - name: Pin npm to v11 (required for stable Trusted Publishing OIDC)
        if: github.event.inputs.dry-run != 'true'
        run: |
          echo "Node 22 LTS ships npm 10.x; npm 11+ has the stable OIDC exchange flow."
          echo "Pre-pin: node=$(node -v) npm=$(npm -v)"
          # `npm i -g npm@11` from npm 10 fails with `MODULE_NOT_FOUND:
          # promise-retry` (known npm self-upgrade bootstrap bug). --force
          # rebuilds dependencies cleanly. Pin to 11.4.x for reproducibility.
          npm install -g --force npm@11
          echo "Post-pin: node=$(node -v) npm=$(npm -v)"

      - name: Delete any auto-written .npmrc files (OIDC must run unauth'd by token)
        if: github.event.inputs.dry-run != 'true'
        run: |
          # Per npm support: "ensure NPM_TOKEN, NODE_AUTH_TOKEN, and any
          # //registry.npmjs.org/:_authToken config are not set anywhere".
          # We removed registry-url from setup-node above (which prevents
          # the auto-write). This step is defense-in-depth in case anything
          # else (pnpm, $NPM_CONFIG_USERCONFIG path) wrote one.
          for f in .npmrc "$HOME/.npmrc" "/root/.npmrc" "$NPM_CONFIG_USERCONFIG"; do
            if [ -n "$f" ] && [ -f "$f" ]; then
              echo "::group::Found .npmrc at $f — contents (auth tokens will not be re-printed)"
              grep -v -E '_authToken|_auth=' "$f" || true
              echo "::endgroup::"
              rm -f "$f"
              echo "Deleted $f"
            fi
          done
          # Belt-and-suspenders: also clear NPM_CONFIG_USERCONFIG so npm
          # doesn't try to read a file the line above just removed (or one
          # at a stale path).
          echo "NPM_CONFIG_USERCONFIG=" >> "$GITHUB_ENV"

      - name: Print diagnostic npm config (per npm support request)
        if: github.event.inputs.dry-run != 'true'
        run: |
          echo "::group::Versions"
          node -v
          npm -v
          echo "::endgroup::"
          echo "::group::npm config"
          npm config get registry
          npm config list -l 2>&1 | grep -v -E '_password|_authToken|_auth=' || true
          echo "::endgroup::"
          echo "::group::npm ping"
          npm ping --registry=https://registry.npmjs.org
          echo "::endgroup::"

      - name: Publish to npm (Trusted Publishing OIDC, direct npm CLI)
        id: publish
        if: github.event.inputs.dry-run != 'true'
        env:
          # CRITICAL: do NOT set NPM_TOKEN, NODE_AUTH_TOKEN, or any auth env.
          # Trusted Publishing exchanges the GitHub OIDC token (minted via
          # id-token: write) for a short-lived npm publish credential.
          # Presence of NPM_TOKEN/NODE_AUTH_TOKEN forces the token-auth path
          # and bypasses OIDC entirely (npm support E404 root cause).
          # Explicitly nullify NODE_AUTH_TOKEN even though setup-node no
          # longer auto-injects it — defense-in-depth.
          NPM_CONFIG_PROVENANCE: "true"
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
        run: |
          echo "Publishing $(node -p 'require("./package.json").name')@$(node -p 'require("./package.json").version') via Trusted Publishing OIDC..."
          # --loglevel verbose surfaces the OIDC token/exchange lines that
          # npm support asked us to capture if this fails again.
          npm publish --access public --provenance --loglevel verbose
          # Surface a `published=true` output so downstream steps still gate
          # off it (matches the prior changesets/action contract).
          PUBLISHED_VERSION=$(node -p "require('./package.json').version")
          {
            echo "published=true"
            echo "publishedVersion=${PUBLISHED_VERSION}"
            echo "publishedPackages=[{\"name\":\"$(node -p 'require("./package.json").name')\",\"version\":\"${PUBLISHED_VERSION}\"}]"
          } >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------
      # POST-PUBLISH: only if changesets actually published.
      # Sync install.sh VERSION + TARBALL_SHA256 to the just-published
      # version, commit back to main, then create a GitHub Release with the
      # tarball + sigstore sidecar + sha256 attached.
      # ---------------------------------------------------------------------
      - name: Sync install.sh to published version
        if: github.event.inputs.dry-run != 'true' && steps.publish.outputs.published == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Prefer dist.shasum (SHA-1) for npm, but compute SHA-256 of the
          # tarball downloaded from the registry — that's what install.sh
          # verifies.
          TARBALL_URL="https://registry.npmjs.org/@webventures/testatlas/-/testatlas-${VERSION}.tgz"
          curl -fsSL "$TARBALL_URL" -o "testatlas-${VERSION}.tgz"
          SHA=$(sha256sum "testatlas-${VERSION}.tgz" | cut -d' ' -f1)
          sed -i.bak "s/^VERSION=.*$/VERSION=\"${VERSION}\"/" install.sh
          sed -i.bak "s/^TARBALL_SHA256=.*$/TARBALL_SHA256=\"${SHA}\"/" install.sh
          rm install.sh.bak
          git config user.name "testatlas-bot"
          git config user.email "bot@testatlas.dev"
          git add install.sh
          git commit -m "chore(release): sync install.sh to v${VERSION}" || echo "no install.sh changes"
          git push origin HEAD:main

      - name: Compute SHA-256 sidecar
        if: github.event.inputs.dry-run != 'true' && steps.publish.outputs.published == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ ! -f "testatlas-${VERSION}.tgz" ]; then
            curl -fsSL "https://registry.npmjs.org/@webventures/testatlas/-/testatlas-${VERSION}.tgz" \
              -o "testatlas-${VERSION}.tgz"
          fi
          sha256sum "testatlas-${VERSION}.tgz" > "testatlas-${VERSION}.tgz.sha256"

      - name: Fetch sigstore bundle from npm provenance store
        if: github.event.inputs.dry-run != 'true' && steps.publish.outputs.published == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # npm registry exposes provenance attestations for packages published
          # under Trusted Publishing; the sigstore bundle is fetched via
          # `npm view ...` or the `attestations.url` pointer.
          ATT_URL=$(npm view "@webventures/testatlas@${VERSION}" --json | node -e "
            let j=''; process.stdin.on('data',c=>j+=c).on('end',()=>{
              const o=JSON.parse(j);
              const a=o.dist && o.dist.attestations;
              process.stdout.write(a && a.url ? a.url : '');
            });
          ")
          if [ -n "$ATT_URL" ]; then
            curl -fsSL "$ATT_URL" -o "testatlas-${VERSION}.tgz.sigstore.json"
          else
            echo "No attestations.url returned by npm; sidecar absent (cosign verification will gate)."
          fi

      - name: Create GitHub Release with assets
        if: github.event.inputs.dry-run != 'true' && steps.publish.outputs.published == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: v${{ fromJson(steps.publish.outputs.publishedPackages)[0].version }}
          name: v${{ fromJson(steps.publish.outputs.publishedPackages)[0].version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            testatlas-*.tgz
            testatlas-*.tgz.sha256
            testatlas-*.tgz.sigstore.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------------------
      # POST-PUBLISH ASSERTION (ISSUE-011 fix): when triggered by
      # release:published (real releases), verify the sigstore sidecar made
      # it to the published GitHub Release assets. Fails the workflow with a
      # loud error if the sigstore.json sidecar is absent — consumers using
      # TESTATLAS_VERIFY_SIGNATURE=1 would otherwise silently break.
      # Skipped on workflow_dispatch (dry-run) since no Release exists yet.
      # ---------------------------------------------------------------------
      - name: Verify sigstore bundle published
        if: github.event_name == 'release' && github.event.action == 'published'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          EXPECTED="testatlas-${VERSION}.tgz.sigstore.json"
          if ! gh release view "${{ github.event.release.tag_name }}" --json assets -q '.assets[].name' | grep -qx "${EXPECTED}"; then
            echo "::error::Sigstore bundle ${EXPECTED} not present in published Release assets — release is broken for --verify-signature consumers. Maintainer must re-attach the sidecar via 'gh release upload'."
            exit 1
          fi
          echo "Sigstore bundle ${EXPECTED} present — release is verifiable."
