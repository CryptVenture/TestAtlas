# E2E Smoke Workflow — VAL-06 + VAL-02 (closes Phase 8 plan 08-04)
#
# Phase 5 shipped this file as a scaffold with `if: false` skips on the
# install + dogfood-loop steps and an always-runs `validate-workspace`
# step against the suite repo's own meta-workspace.
#
# Phase 8 plan 08-04 (this revision) closes the contract:
#   - Removes both `if: false` skips entirely.
#   - Replaces the dogfood-loop placeholder with a real regenerate +
#     validate matrix across all 4 single-workspace examples
#     (nextjs-saas, node-api, cli-tool, mobile-web-hybrid) plus a
#     dedicated `monorepo-validate` job that uses `--all-workspaces`
#     against `examples/monorepo`.
#   - The suite-repo meta-workspace validate step still runs as a
#     dedicated job — orthogonal to the example matrix and unaffected
#     by per-example failures.
#
# Closes EX-06 (CI matrix) + EX-07 (Aider-only proof asserted via
# cli-tool example) + flips VAL-02 to plain Complete.

name: E2E Smoke

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Per-example matrix ──────────────────────────────────────────────────
  # Closes EX-06: every PR runs regenerate-example.js --check (drift
  # detection) plus validate-workspace.js for each single-workspace example.
  # fail-fast: false so one example's failure doesn't mask another's.
  validate-examples:
    name: Validate example (${{ matrix.example }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - nextjs-saas
          - node-api
          - cli-tool
          - mobile-web-hybrid
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@739bfe42ca9233c5e6aca07c1a25a9d34aca49b0  # v6.0.7
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Regenerate example (drift check)
        run: node scripts/regenerate-example.js examples/${{ matrix.example }} --check

      - name: Validate example workspace
        run: node scripts/validate-workspace.js --workspace examples/${{ matrix.example }}/_testatlas

  # ─── Monorepo job (uses --all-workspaces) ───────────────────────────────
  # Plan 08-03 shipped --all-workspaces orchestration. This job exercises
  # the multi-workspace path: regenerate-check the monorepo root + each
  # app workspace, then validate the entire orchard with --all-workspaces.
  monorepo-validate:
    name: Validate monorepo (--all-workspaces)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@739bfe42ca9233c5e6aca07c1a25a9d34aca49b0  # v6.0.7
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Regenerate monorepo root (drift check)
        run: node scripts/regenerate-example.js examples/monorepo --check

      - name: Regenerate monorepo apps/web (drift check)
        run: node scripts/regenerate-example.js examples/monorepo/apps/web --check

      - name: Regenerate monorepo apps/api (drift check)
        run: node scripts/regenerate-example.js examples/monorepo/apps/api --check

      - name: Validate monorepo workspaces (--all-workspaces)
        run: node scripts/validate-workspace.js --all-workspaces examples/monorepo

  # ─── Suite-repo meta-workspace validate (always runs) ───────────────────
  # Phase 5 contract — self-validates the suite's own meta-workspace at
  # .testatlas/test-workspace as a smoke signal that the validate-workspace
  # runtime + the meta-workspace fixture remain in sync.
  suite-repo-validate:
    name: Validate suite-repo meta-workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@739bfe42ca9233c5e6aca07c1a25a9d34aca49b0  # v6.0.7
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Validate suite-repo placeholder workspace
        run: node scripts/validate-workspace.js --workspace .testatlas/test-workspace
