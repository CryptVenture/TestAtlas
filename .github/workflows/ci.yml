name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Biome check
        run: pnpm lint

  test:
    name: Test (${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node:
          - 20.x
          - 22.x
          - 24.x
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Verify Node engines floor
        shell: bash
        run: |
          REQUIRED=$(node -p "require('./package.json').engines.node")
          echo "package.json engines.node: $REQUIRED (expect >=20.11.0)"
          test "$REQUIRED" = ">=20.11.0"

      - name: Install dogfood-test prerequisites (cosign + shellcheck)
        # Quick 260506-07b. /atlas:test-flow --all (Quick B) exercises
        # FLOW-install-curl-pipe-install scenarios that opt-in to cosign
        # attestation verification (TESTATLAS_VERIFY_SIGNATURE=1). Without
        # cosign on PATH the dogfood would silently miss that surface; install
        # it on every test runner. shellcheck is independently provisioned by
        # the dedicated `shellcheck` job below for install.sh, but tests in
        # `test/install-sh/` shell out to it too — install on Linux runners
        # here as well. macOS gets shellcheck via Homebrew preinstall.
        # Windows skips both (no POSIX shell installer there).
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          else
            # macOS: brew preinstall used to ship shellcheck; as of mid-2026
            # the runner image dropped it, so install on demand. `brew install`
            # is a no-op if already present (exits 0), so this is safe whether
            # or not the runner image regains the preinstall.
            if ! command -v shellcheck >/dev/null 2>&1; then
              brew install shellcheck
            fi
          fi
          echo "shellcheck version:"
          shellcheck --version | head -n 3

      - name: Install cosign
        # Quick 260506-07b. SHA-pinned per ISSUE-010 G-09 (tag mutability
        # mitigation); the trailing `# v3.7.0` comment lets Dependabot's
        # actions ecosystem bump the tag and lets reviewers eyeball the
        # human-readable version at a glance.
        if: runner.os != 'Windows'
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da  # v3.7.0

      - name: Echo cosign version
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "cosign version:"
          cosign version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Run node:test
        run: pnpm test

      - name: Validate suite-repo meta-workspace
        # VAL-02 (suite-repo gate): self-validate the suite's own placeholder
        # `_testatlas/`-shaped tree at .testatlas/test-workspace. Per-example
        # validate-workspace gates ship Phase 8 (per .planning/REQUIREMENTS.md
        # VAL-02 partial-acceptance suffix).
        run: node scripts/validate-workspace.js --workspace .testatlas/test-workspace --report=validation-report.md

      - name: Adapter parity gate (strict)
        # VAL-05 (live runtime, Plan 06-05): every command × adapter obligation
        # must be satisfied with no drift of any kind. Transitional mode was
        # retired when all 7 adapters shipped in Phase 6 (Plans 06-01..04).
        run: node scripts/check-adapter-parity.js --strict

      - name: Upload validation report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: validation-report-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            validation-report.md
            validation-report.md.json
          if-no-files-found: ignore

  token-budget:
    name: Token budget (bootstrap ≤3000, commands ≤1800)
    runs-on: ubuntu-latest
    # Per Phase 1 BOOT-04 + 01-RESEARCH.md §"Pattern 5": the gate is dependency-free
    # (built-ins only, no pnpm install needed). Runs on a single OS — algorithm is
    # deterministic and would yield identical results on Linux/macOS/Windows.
    # Phase 3 CMD-03 extends the gate to enforce ≤1800 words per command file.
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22.x

      - name: Verify bootstrap.md is under the 3000-word budget
        run: node scripts/check-token-budget.js .testatlas/bootstrap.md 3000

      - name: Verify every .testatlas/commands/*.md is under the 1800-word budget
        run: node scripts/check-command-budgets.js

  commit-signing:
    name: Commit signing check
    runs-on: ubuntu-latest
    # Per Phase 0 CONTEXT.md: signing is expected from maintainers but NOT
    # enforced for contributor commits (GOV-06 wording: "verified"). This job
    # surfaces the verification status of HEAD without failing the build, so
    # reviewers see the signal in PR checks.
    steps:
      - name: Checkout (with full history)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - name: Report commit signature status
        run: |
          echo "Inspecting HEAD signature status (informational)."
          git log -1 --pretty='format:Commit: %H%nAuthor: %an <%ae>%nSigned: %G? (G=valid, B=bad, N=none, U=unknown)%nSigner: %GS%nReason: %GK%n'
          STATUS=$(git log -1 --pretty='%G?')
          echo "Signature flag: $STATUS"
          if [ "$STATUS" = "G" ]; then
            echo "OK — commit is signed and verified."
          elif [ "$STATUS" = "N" ]; then
            echo "WARN — HEAD commit is unsigned. Maintainers SHOULD sign; contributors are not required to (per Phase 0 CONTEXT.md)."
          else
            echo "WARN — Signature status: $STATUS. Review docs/THREAT_MODEL.md M1.7 for branch-protection expectations."
          fi
        # Intentionally never fails: the job exists to surface the signal.

  shellcheck:
    name: shellcheck install.sh (Linux)
    # Plan 07-02 (INSTALL-02). Linux-only — shellcheck is the same binary
    # on every OS but our policy gate runs once.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: shellcheck install.sh

  install-sh-smoke:
    name: install.sh smoke (${{ matrix.os }})
    # Plan 07-02 (INSTALL-02 + INSTALL-06). POSIX-only — install.sh is /bin/sh
    # and not run on Windows; Windows uses the npx flow validated by the
    # `test` job above.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Pack suite as a fake tarball for the smoke
        # `pnpm pack` writes `<scope>-<name>-<version>.tgz` for scoped
        # packages (since 2026-05-04 the suite is `@webventures/testatlas` →
        # `webventures-testatlas-<version>.tgz`). install.sh's
        # `_TESTATLAS_TARBALL_OVERRIDE` test hook copies this local file in
        # place of a network fetch, fully exercising the extract → invoke
        # node install.js path against a real tarball.
        run: pnpm pack

      - name: Smoke install.sh against tmp target
        run: |
          set -eu
          # Glob matches both legacy `testatlas-<v>.tgz` (pre-scope) and
          # current `webventures-testatlas-<v>.tgz` so a future rename
          # doesn't silently break this gate again.
          TARBALL=$(ls *testatlas-*.tgz | head -1)
          test -n "$TARBALL" || { echo 'no testatlas tarball produced by pnpm pack'; exit 1; }
          TARGET=$(mktemp -d 2>/dev/null || mktemp -d -t testatlas)
          _TESTATLAS_TARBALL_OVERRIDE="$PWD/$TARBALL" TARGET="$TARGET" sh install.sh
          test -d "$TARGET/.testatlas" || { echo 'install.sh did not create .testatlas/'; exit 1; }
          test -f "$TARGET/.testatlas/.install-manifest.json" || { echo 'install-manifest missing'; exit 1; }

      - name: Smoke uninstall round-trip
        run: |
          set -eu
          TARBALL=$(ls *testatlas-*.tgz | head -1)
          test -n "$TARBALL" || { echo 'no testatlas tarball produced by pnpm pack'; exit 1; }
          TARGET=$(mktemp -d 2>/dev/null || mktemp -d -t testatlas)
          _TESTATLAS_TARBALL_OVERRIDE="$PWD/$TARBALL" TARGET="$TARGET" sh install.sh
          node bin/testatlas.js uninstall --target "$TARGET"
          if [ -d "$TARGET/.testatlas" ]; then
            echo '.testatlas/ should be removed'
            exit 1
          fi
          if [ ! -d "$TARGET/_testatlas" ]; then
            echo '_testatlas/ must be preserved by default'
            exit 1
          fi
          node bin/testatlas.js uninstall --target "$TARGET" --force-untracked --purge
          if [ -d "$TARGET/_testatlas" ]; then
            echo '_testatlas/ should be removed under --purge'
            exit 1
          fi
